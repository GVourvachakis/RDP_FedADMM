variables:
  PKG_IND: $CI_COMMIT_SHORT_SHA
  PKG_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${CI_PROJECT_NAME}/1.0.0/p1-573.pdf"

workflow:
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /draft/
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE =~ /^(\[Draft\]|\(Draft\)|Draft:)/
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - test
  - build

image: fedora:latest

test_list:
  stage: test
  script:
    - echo "Installing packages"
    - dnf install -y which ruff
    - echo "Running linting check with $(which ruff)"
    - ruff check .

test_types:
  stage: test
  allow_failure: true
  script:
    - echo "Installing packages"
    - dnf install -y python3-pip
    - echo "Generating venv"
    - python -m venv venv
    - source venv/bin/activate
    - pip install basedpyright
    - basedpyright --gitlabcodequality ci-report.json
  artifacts:
    reports:
      codequality: ci-report.json

fedora_build:
  stage: build
  script:
    - echo "Installing packages"
    - dnf install -y which hatch
    - echo "Building with $(which hatch)"
    - hatch build
  artifacts:
    paths:
      - "./dist/*.whl"
